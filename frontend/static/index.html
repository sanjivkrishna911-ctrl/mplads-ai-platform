<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPLADS AI Monitor | Government Decision Support Platform</title>
  
  <!-- Tailwind CSS via CDN with class-based Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gov: {
              navy: '#0f172a',
              dark: '#1e293b',
              accent: '#2563eb',
              gold: '#d97706',
              danger: '#dc2626',
              success: '#16a34a'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & ReactDOM & Babel for in-browser zero-build rendering -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-['Inter',sans-serif] min-h-screen antialiased">
  <div id="root"></div>

  <!-- Main React App Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
